<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>名古屋観光スポットマップ｜Google Maps API</title>

  <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.3/themes/base/jquery-ui.css">
  <link rel="stylesheet" href="style.css?v=20260903-bomb-text-center">
</head>

<body>
  <button id="panel-toggle" type="button" aria-controls="control-panel" aria-expanded="false">スポット表示</button>

  <aside id="control-panel" aria-label="観光スポットとインタラクティブ機能">
    <div class="panel-header">
      <h1 class="panel-title">名古屋観光スポットマップ</h1>
      <button id="panel-close" class="panel-close-button" type="button" aria-controls="control-panel" aria-expanded="true">閉じる</button>
    </div>
    <div id="tabs">
      <ul>
        <li><a href="#tabs-spots">スポット</a></li>
        <li><a href="#tabs-bombs">インタラクティブ</a></li>
      </ul>

      <section id="tabs-spots">
        <ul id="spot-list" class="spot-list"></ul>
      </section>

      <section id="tabs-bombs" class="bomb-panel">
        <p class="feature-intro">地図をクリックすると、観光マップにインタラクティブな演出を追加できます。</p>
        <fieldset class="bomb-options" aria-label="演出の種類">
          <label class="bomb-option">
            <input type="radio" name="bombType" value="mini" checked>
            <span>
              <strong>小型ボム</strong>
              <span>小さめの閃光</span>
            </span>
          </label>
          <label class="bomb-option">
            <input type="radio" name="bombType" value="firework">
            <span>
              <strong>中型ボム</strong>
              <span>中型爆発。</span>
            </span>
          </label>
          <label class="bomb-option">
            <input type="radio" name="bombType" value="mega">
            <span>
              <strong>大型ボム</strong>
              <span>派手な爆発。</span>
            </span>
          </label>
          <label class="bomb-option">
            <input type="radio" name="bombType" value="ultra">
            <span>
              <strong>超大型ボム</strong>
              <span>最大級の爆発</span>
            </span>
          </label>
        </fieldset>
        <div id="bomb-status" class="status-line" aria-live="polite">地図上をクリックすると爆弾を投下できます。</div>
      </section>
    </div>
  </aside>

  <div id="map" aria-label="Google Maps"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://code.jquery.com/ui/1.13.3/jquery-ui.min.js"></script>
  <script src="script.js?v=20260903-fixed-pin-positions"></script>

  <script
    async
    defer
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB8zeh0ewRI3pTl4ngz9pENkx7tKVBtaLo&callback=initMap">
  </script>
</body>
</html>
